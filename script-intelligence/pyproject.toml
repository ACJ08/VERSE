[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "continuity-script-intelligence"
version = "2.0.0"
description = "AI-powered screenplay and production document intelligence system for film continuity workflows."
readme = "README.md"
authors = [
    { name = "Mohd Arslaan Ayub", email = "arslaan@verse.ai" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "pydantic>=2.13.4",
    "openai>=1.0.0",
    "pymupdf>=1.28.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.32"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "C90", "I"]
ignore = []
